---
- name: add apt key for osquery
  apt_key:
    keyserver: "keyserver.ubuntu.com"
    id: "1484120AC4E9F8A1A577AEEE97A80C63C9D8B80B"
    state: present

- name: add apt repository for osquery
  apt_repository:
    repo: "deb [arch=amd64] https://pkg.osquery.io/deb deb main"
    state: present

- name: install osquery
  apt:
    name: osquery
    state: present
    update_cache: true
