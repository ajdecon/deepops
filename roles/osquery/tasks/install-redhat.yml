---
- name: install rpm key for osquery repo
  rpm_key:
    state: "present"
    key: "https://pkg.osquery.io/rpm/GPG"

- name: add yum repository for osquery repo
  get_url:
    url: "https://pkg.osquery.io/rpm/osquery-s3-rpm.repo"
    dest: "/etc/yum.repos.d/osquery-s3-rpm.repo"
    mode: "0644"

- name: install osquery
  yum:
    name: "osquery"
    state: "present"
